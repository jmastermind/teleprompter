name: Build & Push Docker image

on:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      # Postavi kao repo secret ako želiš auto-deploy; bez njega se korak preskače.
      PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Prvo lokalni build pa provjera nginx konfiguracije — da se na GHCR nikad
      # ne popne slika koja se ne može ni pokrenuti.
      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: teleprompter:test
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Check nginx config
        run: docker run --rm --entrypoint nginx teleprompter:test -t

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/teleprompter:latest
            ghcr.io/${{ github.repository_owner }}/teleprompter:${{ github.sha }}

      # Portainer sam povuče novu sliku i ponovno pokrene stack.
      - name: Trigger Portainer redeploy
        if: env.PORTAINER_WEBHOOK != ''
        run: curl -fsS -X POST "$PORTAINER_WEBHOOK"
