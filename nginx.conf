server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;
    gzip_min_length 512;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Dohvat teksta s Pastebina. Preglednik to ne može izravno jer Pastebin ne
    # šalje CORS zaglavlja. Namjerno je zaključano na pastebin.com/raw/<ključ> —
    # nije opći proxy, putanju određuje regex, a ne korisnikov unos.
    location ~ ^/pastebin/(?<paste_key>[A-Za-z0-9]+)$ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;

        proxy_pass https://pastebin.com/raw/$paste_key;
        proxy_ssl_server_name on;
        proxy_set_header Host pastebin.com;
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;

        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    # Cijela aplikacija je tek nekoliko desetaka kB, pa neka preglednik uvijek
    # provjeri ima li novija verzija (ETag → 304). Inače nakon redeploya ostane
    # stari app.js iz predmemorije i izgleda kao da se ništa nije promijenilo.
    location ~* \.(html|js|css|json|svg|txt)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|ico|jpe?g|woff2?)$ {
        add_header Cache-Control "max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
