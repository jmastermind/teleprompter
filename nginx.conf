server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;
    gzip_min_length 512;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Cijela aplikacija je tek nekoliko desetaka kB, pa neka preglednik uvijek
    # provjeri ima li novija verzija (ETag → 304). Inače nakon redeploya ostane
    # stari app.js iz predmemorije i izgleda kao da se ništa nije promijenilo.
    location ~* \.(html|js|css|json|svg|txt)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|ico|jpe?g|woff2?)$ {
        add_header Cache-Control "max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
