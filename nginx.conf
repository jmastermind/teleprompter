server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;
    gzip_min_length 512;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # HTML i service worker se ne smiju keširati — inače nova verzija ne dođe do preglednika.
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js|svg|png|ico|woff2?)$ {
        add_header Cache-Control "max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
